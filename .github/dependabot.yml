version: 2
updates:
  # Mobile (Expo / React Native).
  # Expo SDK packages are version-locked to the SDK release, so Dependabot's
  # major bumps here are always false positives: SDK 54 pins expo-font to
  # ~14.x while Dependabot offers 55.x, which belongs to SDK 55. These move
  # together during an SDK upgrade, never as standalone PRs.
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # 0 disables version-update PRs. Security updates are unaffected and
    # still open PRs, which is the only dependency noise worth having here.
    open-pull-requests-limit: 0
    groups:
      react-dependencies:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # NativeWind 4 requires Tailwind 3; Tailwind 4 is a breaking rewrite.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nativewind"
        update-types: ["version-update:semver-major"]

  # Desktop UI (Vite / Tauri frontend).
  - package-ecosystem: "npm"
    directory: "/desktop/ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # 0 disables version-update PRs. Security updates are unaffected and
    # still open PRs, which is the only dependency noise worth having here.
    open-pull-requests-limit: 0
    groups:
      tauri-dependencies:
        patterns:
          - "@tauri-apps/*"
    ignore:
      # A vite 5 -> 8 jump was proposed for an advisory that a patch release covers.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  # Desktop service and Tauri shell (Rust).
  - package-ecosystem: "cargo"
    directory: "/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # 0 disables version-update PRs. Security updates are unaffected and
    # still open PRs, which is the only dependency noise worth having here.
    open-pull-requests-limit: 0
    ignore:
      # hickory-proto 0.26 fails to compile libreascent-service with 30
      # errors (changed signatures, removed methods). Adopting it needs the
      # DNS code ported to the new API. The advisory stays open and visible
      # in the security tab; this only stops the un-mergeable PR recurring.
      # Scoped to the 0.25+ line only, so a mergeable 0.24.x patch-level
      # security fix still opens a PR. A bare dependency-name ignore would
      # suppress those too, since ignore rules apply to security updates.
      - dependency-name: "hickory-proto"
        versions: [">= 0.25"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
