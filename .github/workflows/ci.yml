name: CI Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the default GITHUB_TOKEN. Both jobs only read the
# repository: checkout, npm ci, and cargo. Without this the token inherits
# the repository default, which can include write scopes these jobs never use.
permissions:
  contents: read

jobs:
  mobile:
    name: Mobile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Node 22+ is required: scripts/check-cached-domains-paging.js uses
      # node:sqlite, which does not exist in Node 20.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Gradle reads node_modules for Expo autolinking, so this must follow npm ci.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: TypeScript
        working-directory: ./mobile
        run: npm run typecheck

      - name: Lint
        working-directory: ./mobile
        run: npm run lint

      - name: Self-checks
        working-directory: ./mobile
        run: npm run check

      # Last because it is the slowest step; the JS checks above fail faster.
      - name: Native module unit tests
        working-directory: ./mobile/android
        run: ./gradlew :freedom-vpn-service:testDebugUnitTest :freedom-accessibility-service:testDebugUnitTest :freedom-foreground-service:testDebugUnitTest --console=plain

  # Windows runner: libreascent-service depends on the windows_service crate,
  # so the desktop workspace does not compile on Linux.
  desktop:
    name: Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: ./desktop/ui
        run: npm ci

      - name: Build UI
        working-directory: ./desktop/ui
        run: npm run build

      - name: Cargo check
        working-directory: ./desktop
        run: cargo check --workspace
