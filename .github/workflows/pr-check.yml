name: PR Quality Check

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: write

jobs:
  review:
    name: Runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node 22+ is required: scripts/check-cached-domains-paging.js uses
      # node:sqlite, which does not exist in Node 20.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: TypeScript Check
        working-directory: ./mobile
        run: npm run typecheck

      - name: Self-checks
        working-directory: ./mobile
        run: npm run check

      - name: Run ESLint Review
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: error
          workdir: ./mobile

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks Security Scan
        run: |
          gitleaks detect --no-git --redact -v --source .
