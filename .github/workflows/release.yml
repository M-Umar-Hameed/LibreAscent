name: Release Build

permissions:
  contents: write # Needed to create the Release on your repo

on:
  push:
    tags:
      - 'v*' # Triggers only when you push a tag like v1.0.0, v0.1.0

jobs:
  build-windows:
    runs-on: windows-latest # GitHub provides a Windows Server for free

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        working-directory: ./desktop/ui
        run: npm ci

      - name: Build and Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub
        with:
          projectPath: desktop/ui
          tagName: ${{ github.ref_name }}
          releaseName: 'LibreAscent v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

  build-android:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      # The release keystore never lives in the repo: debug.keystore is
      # committed and uses the well-known debug key, so a build signed with it
      # could be forged by anyone and installed as an update over LibreAscent.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed APK." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        working-directory: ./mobile/android
        env:
          ORG_GRADLE_PROJECT_LIBREASCENT_STORE_FILE: ${{ runner.temp }}/release.keystore
          ORG_GRADLE_PROJECT_LIBREASCENT_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_LIBREASCENT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_LIBREASCENT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      # Guards against a silent regression to the debug key: the release
      # keystore must not carry the debug certificate's subject.
      - name: Verify the APK is not debug-signed
        working-directory: ./mobile
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CERTS=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "APK is signed with the Android debug certificate; refusing to publish." >&2
            exit 1
          fi

      - name: Attach APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
